name = "schedule"
summary = "Run the preceding steps on a timer."
version = "1.0"

[[param]]
name = "at"
type = "time"
required = true
doc = "Local time of day, HH:MM."

[[param]]
name = "frequency"
type = "enum"
required = false
default = "daily"
values = ["hourly", "daily", "weekly"]
doc = "How often to run."

[permissions]
read_paths = []
write_paths = []
network = false

# Consumed by the packager, which turns it into a systemd timer rather than
# running anything itself.
[exec]
kind = "timer"
argv = []
