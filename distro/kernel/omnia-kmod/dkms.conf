PACKAGE_NAME="omnia-kmod"
PACKAGE_VERSION="0.1.0"

BUILT_MODULE_NAME[0]="omnia_kmod"
DEST_MODULE_LOCATION[0]="/kernel/drivers/misc"
AUTOINSTALL="yes"

# Rebuilt on every kernel upgrade. The autonomous daemon refuses to claim the
# executor role when the module is missing, so a failed DKMS build degrades the
# system to observe-only rather than to something unpredictable.
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make clean"
